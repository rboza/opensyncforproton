# Exact, stable versions only (D24). Changes show up in review together with
# the dependency locks and gradle/verification-metadata.xml.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
junit = "5.14.4"
ezvcard = "0.12.2"
# ez-vcard's own parser, already on the classpath through it; used directly for N lists and escapes.
vinnie = "2.0.2"
kotlinxSerialization = "1.11.0"
okhttp = "5.5.0"
retrofit = "3.0.0"
coroutines = "1.11.0"
room = "2.8.5"
work = "2.12.0"
# The app's UI. The BOM pins Compose (ui 1.12.1, material3 1.4.0, material-icons-core 1.7.8: the screens' icons).
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
# The captcha WebView's message listener and document-start script.
webkit = "1.17.1"
ksp = "2.3.12"
robolectric = "4.17"
# Robolectric's SDK 37 runtime, declared so Gradle locks and verifies it (Robolectric runs offline).
robolectricAndroidAll = "17-robolectric-15733970-i7"
junit4 = "4.13.2"
# Proton's crypto (D6). android-golib is Proton's pin for crypto-android 36.8.0.
protonCore = "36.8.0"
protonGolib = "2.9.0-2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# compileSdk, minSdk, and targetSdk (D1), and the build tools `mise run android-sdk` installs.
sdk = "37"
buildTools = "37.0.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
proton-crypto-android = { module = "me.proton.core:crypto-android", version.ref = "protonCore" }
proton-android-golib = { module = "me.proton.crypto:android-golib", version.ref = "protonGolib" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
ezvcard = { module = "com.googlecode.ez-vcard:ez-vcard", version.ref = "ezvcard" }
vinnie = { module = "com.github.mangstadt:vinnie", version.ref = "vinnie" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
